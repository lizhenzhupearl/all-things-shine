<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Clearing cache...</title></head>
<body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#1a1a2e;color:#fff;">
<div style="text-align:center;">
<p id="status">Clearing cache...</p>
</div>
<script>
(async function() {
  const s = document.getElementById('status');
  try {
    // Unregister all service workers
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
      s.textContent = 'Service workers cleared...';
    }
    // Delete all caches
    if ('caches' in window) {
      const keys = await caches.keys();
      for (const k of keys) await caches.delete(k);
      s.textContent = 'Caches cleared...';
    }
    s.textContent = 'Done! Redirecting...';
    setTimeout(() => window.location.href = './', 1000);
  } catch(e) {
    s.textContent = 'Error: ' + e.message + '. Try clearing Safari data manually.';
  }
})();
</script>
</body>
</html>
